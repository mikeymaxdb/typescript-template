name: Build + Publish

on:
    push:
        branches:
            - main
        tags:
            - 'v*'

permissions:
    contents: read
    id-token: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/setup@v2
              with:
                  runtime: node@26
                  cache: true

            - run: pnpm run test

            - run: pnpm run typecheck

            - run: pnpm run lint

            - run: pnpm run format:check

            - run: pnpm run build

    publish:
        needs: build
        runs-on: ubuntu-latest

        if: startsWith(github.ref, 'refs/tags/v')

        steps:
            - uses: actions/checkout@v6

            - uses: pnpm/setup@v2
              with:
                  runtime: node@26
                  cache: true

            - run: pnpm ci

            - run: pnpm run build

            # - run: npm publish --provenance --dry-run
